type: CheckConfig
api_version: core/v2
metadata:
  name: check-txt-dns
  namespace: default
  labels:
    sensu.io/managed_by: sensuctl
    sensu.io/workflow: sensu-flow
  annotations:
    fatigue_check/occurrences: '1' # first failure
    fatigue_check/interval: '0' # do not repeat
    fatigue_check/allow_resolution: 'true'
spec:
  check_hooks: null
  command: >- 
    set -e; 
    for domain in {{ .labels.check_domains }}; do 
      echo $domain; 
      dig -t txt $domain;
      dig -t txt $domain | grep 'IN TXT "';
      echo ""; 
    done

    figlet success
  env_vars: null
  handlers:
    # - ntfy -> likely not "this minute" urgent...
    - email
  high_flap_threshold: 0
  cron: '0 6 * * *' # 6 am daily
  low_flap_threshold: 0
  output_metric_format: influxdb_line
  output_metric_handlers:
    - influxdb
  pipelines: []
  proxy_entity_name: ''
  proxy_requests:
    entity_attributes:
      - entity.entity_class == 'proxy'
      - entity.labels.proxy_type == 'dns'
      - entity.labels.dns_type == 'txt'
    splay: false
    splay_coverage: 0
  publish: true
  round_robin: true
  runtime_assets: []
  secrets: null
  stdin: false
  subdue: null
  subscriptions:
    - run_proxies
  timeout: 0
  ttl: 0
  max_output_size: 0
  discard_output: false
