- name: Handle OS based items
  ansible.builtin.include_tasks: "{{ ansible_os_family }}.yml"

- name: Check for XZ CVE
  ansible.builtin.include_tasks: check_for_cve.yml

- name: Firewall configs (firewalld)
  become: true
  when: use_firewalld | bool
  block:
    - name: 'Firewall: permit traffic in default zone services'
      ansible.posix.firewalld:
        service: '{{ item }}'
        permanent: true
        state: enabled
      when: enable_public_web | bool
      with_items:
        - http
        - https

    - name: 'Firewall: Enable ssh port'
      ansible.posix.firewalld:
        port: '{{ SSH_PORT }}/tcp'
        permanent: true
        state: enabled

- name: Check if UFW is active
  become: true
  when: not (use_firewalld | bool)
  block:
    - name: Check whether ufw status is active
      check_mode: true
      community.general.ufw:
        state: enabled
      register: ufw_enable_check
  rescue:
    - name: Ensure UFW installed
      ansible.builtin.package:
        name: ufw
        state: present
    - name: Assume not active
      ansible.builtin.debug:
        msg: UFW enable failed, assuming it's not active
      register: ufw_enable_check
      changed_when: true


- name: Firewall config (ufw)
  become: true
  when: not (use_firewalld | bool)
  block:
    - name: Enable UFW and deny everything # noqa: no-handler - this is a only if needed step
      when: ufw_enable_check.changed
      community.general.ufw:
        state: enabled
        default: reject

    - name: 'Firewall: Enable ssh port'
      community.general.ufw:
        port: '{{ SSH_PORT }}'
        rule: allow
        proto: tcp
        comment: 'Allow SSH connections on port {{ SSH_PORT }}'
    - name: 'Firewall: permit traffic in default zone services'
      community.general.ufw:
        app: '{{ item }}'
        policy: allow
      when: enable_public_web | bool
      with_items:
        - http
        - https

- name: Ensure nginx restarts if it errors out.
  become: true
  block:
  - name: Ensure dir exists for nginx overrides
    become: true
    ansible.builtin.file:
      path: /etc/systemd/system/nginx.service.d
      state: directory
      owner: root
      group: root
      mode: "0755"


  - name: Make nginx restart any time it errors out
    ansible.builtin.copy:
      dest: /etc/systemd/system/nginx.service.d/override.conf
      content: |
        [Service]
        Restart=always
        RestartSec=10s
      owner: root
      group: root
      mode: "0644"
      force: true
    notify:
      - Restart nginx
      - Reload systemd


- name: Run handlers now to ensure nginx is restarted if needed before we check for the CVE
  ansible.builtin.meta: flush_handlers
