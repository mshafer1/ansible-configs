- name: Install plugin
  include_tasks: '{{ ansible_os_family }}.yml'

- name: Enable rtmp (straight)
  become: true
  when: not multistream_server__use_ssl
  block:
    - name: Add to config file
      notify: restart nginx service
      ansible.builtin.blockinfile:
        marker: "# {mark} ANSIBLE CONFIG -- rtmp server"
        dest: /etc/nginx/nginx.conf
        block: "{{ lookup('template', 'rtmp_site.j2') }}"

- name: Enable rtmp (straight)
  become: true
  when: multistream_server__use_ssl
  block:
    - name: Add to config file
      notify: restart nginx service
      ansible.builtin.blockinfile:
        marker: "# {mark} ANSIBLE CONFIG -- rtmp server"
        dest: /etc/nginx/nginx.conf
        block: "{{ lookup('template', 'rtmp_site_ssl.j2') }}"

- name: Allow RTMP through firewall
  when: not multistream_server__use_ssl
  block:
    - name: Allow RTMP through firewall
      when: not multistream_server__use_ufw
      ansible.posix.firewalld:
        immediate: true
        port: 1935/tcp
        permanent: true
        state: enabled

    - name: Allow RTMP through firewall (ufw)
      when: multistream_server__use_ufw
      community.general.ufw:
        port: 1935
        rule: allow
        proto: tcp
        comment: 'Allow rtmp through firewall'

- name: Allow RTMP through firewall
  when: multistream_server__use_ssl
  block:
    - name: Allow RTMP through firewall
      when: not multistream_server__use_ufw
      ansible.posix.firewalld:
        immediate: true
        port: '{{ item }}/tcp'
        permanent: true
        state: enabled
      loop:
        - 1935
        - 1936

    - name: Allow RTMP through firewall (ufw)
      when: multistream_server__use_ufw
      community.general.ufw:
        port: '{{ item }}'
        rule: allow
        proto: tcp
        comment: 'Allow rtmp port ({{ item }}) through firewall'
      loop:
        - 1935
        - 1936


- name: Get cert
  when: multistream_server__use_ssl
  block:
    - name: Attempt to get cert
      register: certbot_call
      ansible.builtin.shell:
        cmd: >
          /root/.local/bin/certbot certonly
          -v
          --manual --manual-auth-hook /etc/letsencrypt/acme-dns-auth.py
          --preferred-challenges dns
          --debug-challenges
          --non-interactive
          --agree-tos
          -d {{ multistream_server__fqdn }} 2>&1 | tee -a /var/tmp/certbot_output_{{ multistream_server__fqdn }}
      failed_when: "'Certbot failed to authenticate some domains' in certbot_call.stdout"
      changed_when: >
        'Successfully received certificate.' in certbot_call.stdout and
        'skipped, since /etc/letsencrypt/live/' + multistream_server__fqdn + '/privkey.pem exists' not in certbot_call.stdout and
        certbot_call.rc != 0
      args:
        creates: /etc/letsencrypt/live/{{ multistream_server__fqdn }}/privkey.pem
